<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkstow Rust Preview</title>
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; color: #242832; background: #faf9f6; }
    header { padding: 16px 24px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; align-items: center; }
    h1 { font-size: 20px; margin: 0 20px 0 0; }
    input { padding: 8px; min-width: 210px; }
    button { padding: 8px 12px; cursor: pointer; }
    #vault { flex: 1; }
    main { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 130px); }
    aside { border-right: 1px solid #ddd; padding: 16px; overflow: auto; }
    #notes { list-style: none; padding: 0; }
    #notes button { border: 0; background: transparent; width: 100%; text-align: left; overflow-wrap: anywhere; }
    #notes button[aria-current="true"] { background: #e0e8ef; }
    article { display: flex; flex-direction: column; padding: 16px 32px; min-width: 0; }
    #note-actions { display: flex; align-items: center; gap: 10px; }
    #note-actions h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #move-form, #delete-bar { padding: 12px; background: #e8edf4; margin-bottom: 10px; }
    #move-path { min-width: 260px; }
    #update-links { min-width: 0; }
    #move-warning { color: #784219; }
    #conflict { padding: 12px; background: #fff3d9; margin-bottom: 10px; }
    #conflict[hidden], [hidden] { display: none !important; }
    #conflict p { margin: 0 0 8px; }
    #editor { flex: 1; resize: none; padding: 24px; line-height: 1.5; font: 16px/1.5 monospace; border: 1px solid #ddd; }
    #editor:disabled { background: #f4f4f4; }
    #quit-prompt button { margin-right: 6px; }
    #status { padding: 12px 24px; border-top: 1px solid #ddd; min-height: 20px; }
  </style>
</head>
<body>
  <header><h1>Inkstow Rust Preview</h1><input id="vault" aria-label="Vault folder" placeholder="Absolute path to a disposable vault"><button id="open">Open vault</button><button id="save">Save</button></header>
  <main><aside><form id="create"><input id="new-path" aria-label="New note path" placeholder="Folder/New note"><button>Create</button></form><ul id="notes"></ul></aside><article><div id="note-actions"><h2 id="title">No note selected</h2><button id="rename" disabled>Rename / move…</button><button id="delete" disabled>Delete…</button></div><form id="move-form" hidden><label>New vault-relative path <input id="move-path" required></label><label><input id="update-links" type="checkbox" checked> Update links</label><p id="move-warning" hidden>Don't update may break links to this note.</p><button type="submit">Move note</button><button type="button" id="cancel-move">Cancel</button></form><div id="delete-bar" hidden>Move this note to the system trash? <button id="confirm-delete">Move to trash</button><button id="cancel-delete">Cancel</button></div><div id="conflict" hidden><p id="conflict-message"></p><button id="reload" hidden>Reload from disk</button><button id="keep" hidden>Keep mine</button><button id="merge" hidden>Merge outside changes</button><button id="save-as-new" hidden>Save as new note</button><button id="discard" hidden>Discard edits</button></div><textarea id="editor" aria-label="Note text" disabled spellcheck="false"></textarea></article></main>
  <div id="status" role="status">Preview only - use a disposable vault. Enter its absolute folder path above.</div>
  <dialog id="quit-prompt" aria-label="Unsaved changes"><p>What would you like to do with your unsaved edits?</p><button type="button" id="cancel-quit">Cancel</button><button type="button" id="discard-quit">Discard and quit</button><button type="button" id="save-quit">Save and quit</button></dialog>
  <script src="./close.js"></script>
  <script src="./app.js"></script>
</body>
</html>
