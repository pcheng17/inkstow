name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already merged in CMakeLists.txt (for example, 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

# A second dispatch must not create the same tag or race the publishing job.
concurrency:
  group: inkstow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the reviewed version and unused tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Exercise the complete packaging pipeline on PRs, without tagging.
            VERSION=$(grep -E '^project\(Inkstow VERSION [0-9]+\.[0-9]+\.[0-9]+ LANGUAGES CXX\)$' CMakeLists.txt | cut -d ' ' -f3)
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || {
              echo 'Run releases from main only.' >&2
              exit 1
            }
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Enter a SemVer core version such as 0.1.0.' >&2
            exit 1
          }
          grep -Fxq "project(Inkstow VERSION $VERSION LANGUAGES CXX)" CMakeLists.txt || {
            echo 'First merge a PR updating the version in CMakeLists.txt.' >&2
            exit 1
          }
          tag="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && \
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; releases are immutable." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install build and system WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwebkit2gtk-4.1-dev xvfb xauth
      - name: Configure, build and test
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release --target inkstow-webview unit-tests --parallel 2
          ctest --test-dir build/release -N | grep -q webview-conflict-window-tests
          ctest --preset release
      - name: Package and smoke test the extracted app
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -s build/release/generated/LocalHtml.h # Offline frontend is compiled into the executable.
          ldd build/release/inkstow-webview | grep -q 'libwebkit2gtk-4.1.so'
          ! ldd build/release/inkstow-webview | grep -E 'libQt[0-9]'
          mkdir -p dist/inkstow artifacts
          cp build/release/inkstow-webview packaging/inkstow.desktop packaging/inkstow.svg \
            packaging/RUNTIME.txt dist/inkstow/
          tar -czf "artifacts/inkstow-$TAG-linux-x86_64.tar.gz" -C dist inkstow
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          tar -xzf "artifacts/inkstow-$TAG-linux-x86_64.tar.gz" -C "$scratch"
          mkdir -p "$scratch/config" "$scratch/data"
          env HOME="$scratch" XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data" \
            xvfb-run -a "$scratch/inkstow/inkstow-webview" &
          pid=$!
          sleep 5
          kill -0 "$pid" || { echo 'Extracted app exited at startup.' >&2; wait "$pid"; exit 1; }
          kill "$pid"
          wait "$pid" || true
          compressed=$(stat -c %s "artifacts/inkstow-$TAG-linux-x86_64.tar.gz")
          unpacked=$(find dist/inkstow -type f -printf '%s\n' | awk '{sum+=$1} END {printf "%.0f", sum}')
          printf '### Linux x86_64 release artifact\n\n| Archive | Compressed bytes | Unpacked file bytes | External runtime |\n| --- | ---: | ---: | --- |\n| inkstow-%s-linux-x86_64.tar.gz | %s | %s | System WebKitGTK 4.1 / GTK 3 |\n' \
            "$TAG" "$compressed" "$unpacked" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Configure, build and test
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 # macos-15 must be a native Apple Silicon runner.
          cmake --preset release
          cmake --build --preset release --target inkstow-webview unit-tests --parallel 2
          ctest --test-dir build/release -N | grep -q webview-conflict-window-tests
          ctest --preset release
      - name: Package and smoke test the app bundle
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -s build/release/generated/LocalHtml.h
          mkdir -p artifacts dist
          app=build/release/Inkstow.app
          test -x "$app/Contents/MacOS/Inkstow"
          mkdir -p "$app/Contents/Resources"
          cp packaging/RUNTIME.txt "$app/Contents/Resources/RUNTIME.txt"
          # The system WKWebView and AppKit frameworks are not vendored.
          ditto "$app" dist/Inkstow.app
          codesign --force --deep --sign - dist/Inkstow.app
          codesign --verify --deep --strict dist/Inkstow.app
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/config" "$scratch/data"
          HOME="$scratch" XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data" \
            dist/Inkstow.app/Contents/MacOS/Inkstow &
          pid=$!
          sleep 5
          kill -0 "$pid" || { echo 'Bundled app exited at startup.' >&2; wait "$pid"; exit 1; }
          kill "$pid"
          wait "$pid" || true
          ditto -c -k --sequesterRsrc --keepParent dist/Inkstow.app \
            "artifacts/inkstow-$TAG-macos-arm64.zip"
          compressed=$(stat -f %z "artifacts/inkstow-$TAG-macos-arm64.zip")
          unpacked=$(find dist/Inkstow.app -type f -exec stat -f %z {} + | awk '{sum+=$1} END {printf "%.0f", sum}')
          printf '### macOS arm64 release artifact\n\n| Archive | Compressed bytes | Unpacked file bytes | External runtime |\n| --- | ---: | ---: | --- |\n| inkstow-%s-macos-arm64.zip | %s | %s | OS WKWebView |\n' \
            "$TAG" "$compressed" "$unpacked" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/*
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release --config Release --target inkstow-webview unit-tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = ctest --test-dir build/release -C Release -N
          if ($LASTEXITCODE -ne 0 -or -not ($tests -match 'webview-conflict-window-tests')) { throw 'Missing real-window smoke test' }
          ctest --preset release -C Release --repeat until-fail:10 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke test the extracted app
        shell: pwsh
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if (-not (Test-Path build/release/generated/LocalHtml.h)) { throw 'Offline frontend not built' }
          New-Item -ItemType Directory -Force artifacts, dist/inkstow | Out-Null
          Copy-Item build/release/Release/inkstow-webview.exe dist/inkstow/
          Copy-Item packaging/RUNTIME.txt dist/inkstow/
          # WebView2 Evergreen is an external runtime, not a shipped DLL.
          if (Test-Path dist/inkstow/WebView2Loader.dll) { throw 'Unexpected bundled WebView2 loader' }
          Compress-Archive -Path dist/inkstow -DestinationPath "artifacts/inkstow-$env:TAG-windows-x86_64.zip"
          $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Force $scratch | Out-Null
          try {
            Expand-Archive "artifacts/inkstow-$env:TAG-windows-x86_64.zip" -DestinationPath $scratch
            # Do not use a previously opened vault or installed toolkit DLLs.
            $env:APPDATA = Join-Path $scratch 'AppData'
            $env:LOCALAPPDATA = Join-Path $scratch 'LocalAppData'
            New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $app = Start-Process (Join-Path $scratch 'inkstow/inkstow-webview.exe') -PassThru
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) { throw "Extracted app exited at startup with code $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'Extracted app started but showed no window' }
          } finally {
            if ($app) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
            Remove-Item -Recurse -Force $scratch
          }
          $compressed = (Get-Item "artifacts/inkstow-$env:TAG-windows-x86_64.zip").Length
          $unpacked = (Get-ChildItem dist/inkstow -Recurse -File | Measure-Object -Property Length -Sum).Sum
          @"
          ### Windows x86_64 release artifact

          | Archive | Compressed bytes | Unpacked file bytes | External runtime |
          | --- | ---: | ---: | --- |
          | inkstow-$env:TAG-windows-x86_64.zip | $compressed | $unpacked | WebView2 Evergreen, VC++ Redistributable |

          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Check artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x86_64.tar.gz macos-arm64.zip windows-x86_64.zip; do
            test -s "dist/inkstow-$TAG-$platform"
          done
          cd dist
          sha256sum inkstow-* > SHA256SUMS
          # Create an immutable version tag only after every platform passes.
          # Keep the release private until all uploads succeed.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Inkstow $TAG" --generate-notes --draft \
            inkstow-* SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
