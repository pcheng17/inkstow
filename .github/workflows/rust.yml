name: Rust CI

on:
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'rust/**'
      - 'tests/fixtures/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust.yml'
      - 'rust/**'
      - 'tests/fixtures/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test Rust workspace
        run: cargo +stable test --workspace --locked
      - name: Lint Rust workspace
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
