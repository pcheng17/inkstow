name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sandcastle-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo ./scripts/install --system
      - name: Configure
        run: cmake --preset debug
      - name: Build app and tests
        run: cmake --build --preset debug --target inkstow unit-tests ui-tests --parallel 2
      - name: Test
        run: ctest --preset debug

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies and clang-tidy
        run: sudo ./scripts/install --system
      - name: Configure with WebView enabled
        run: cmake --preset debug -DINKSTOW_BUILD_WEBVIEW=ON
      - name: Build all checked targets
        run: cmake --build --preset debug --target inkstow inkstow-webview unit-tests ui-tests vault-inspect --parallel 2
      - name: Check compilation database and run clang-tidy
        run: python3 scripts/check-clang-tidy.py --clang-tidy clang-tidy-18

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clang-format 22
        run: python -m pip install clang-format==22.1.3
      - name: Check formatting without changing files
        run: find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 -r clang-format --dry-run --Werror
